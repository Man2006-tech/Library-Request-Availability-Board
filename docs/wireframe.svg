<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Wireframe - Library Request and Availability Board</title>
  <desc id="d">Desktop wireframe with navbar, hero, dashboard, catalogue cards and a mobile wireframe with stacked cards.</desc>
  <rect width="1000" height="620" fill="#f6f3ec"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#0b2545">Wireframe - Desktop (&#8805; 1024px)</text>
  <g stroke="#0b2545" stroke-width="1.5" fill="#fff">
    <rect x="20" y="40" width="640" height="560" rx="6"/>
    <rect x="20" y="40" width="640" height="40" fill="#0b2545"/>
  </g>
  <g font-size="11" fill="#fff"><text x="32" y="65">Logo</text><text x="200" y="65">Home</text><text x="260" y="65">Browse Books</text><text x="350" y="65">My Requests</text><text x="440" y="65">Librarian</text><text x="585" y="65">Role [v]</text></g>
  <rect x="32" y="92" width="616" height="90" fill="#e8edf5" stroke="#0b2545"/>
  <text x="44" y="118" font-size="14" font-weight="700" fill="#0b2545">HERO: headline + [Browse books] [My requests]</text>
  <text x="44" y="140" font-size="11" fill="#444">Short explanation of the problem and who it is for</text>
  <g stroke="#0b2545" fill="#fff"><rect x="32" y="194" width="96" height="52"/><rect x="136" y="194" width="96" height="52"/><rect x="240" y="194" width="96" height="52"/><rect x="344" y="194" width="96" height="52"/><rect x="448" y="194" width="96" height="52"/><rect x="552" y="194" width="96" height="52"/></g>
  <g font-size="10" fill="#0b2545" text-anchor="middle"><text x="80" y="224">Total</text><text x="184" y="224">Available</text><text x="288" y="224">Borrowed</text><text x="392" y="224">Reserved</text><text x="496" y="224">Pending</text><text x="600" y="224">Waiting</text></g>
  <text x="32" y="270" font-size="12" font-weight="700" fill="#0b2545">DASHBOARD (6 stat tiles + availability bar)</text>
  <rect x="32" y="282" width="616" height="40" fill="#fff" stroke="#0b2545"/>
  <text x="44" y="306" font-size="11" fill="#444">[ Search title / author / category ]  [Category v]  [Availability v]  [Clear]</text>
  <g stroke="#0b2545" fill="#fff"><rect x="32" y="336" width="196" height="120"/><rect x="238" y="336" width="196" height="120"/><rect x="444" y="336" width="196" height="120"/><rect x="32" y="466" width="196" height="120"/><rect x="238" y="466" width="196" height="120"/><rect x="444" y="466" width="196" height="120"/></g>
  <g font-size="10" fill="#333"><text x="42" y="358">[status badge]  tag</text><text x="42" y="378" font-weight="700">Book title</text><text x="42" y="394">Author / ID</text><text x="42" y="412">Due date / queue position</text><text x="42" y="440">[ Request ] / [ Join queue ]</text></g>
  <text x="560" y="600" font-size="10" fill="#555" text-anchor="end">Book catalogue: 3-column card grid</text>

  <text x="700" y="28" font-size="18" font-weight="700" fill="#0b2545">Mobile (&lt; 768px)</text>
  <g stroke="#0b2545" stroke-width="1.5" fill="#fff"><rect x="700" y="40" width="270" height="560" rx="14"/><rect x="700" y="40" width="270" height="40" fill="#0b2545"/></g>
  <text x="712" y="65" font-size="11" fill="#fff">Logo</text><text x="925" y="66" font-size="16" fill="#fff">&#9776;</text>
  <rect x="712" y="92" width="246" height="30" fill="#fff6dc" stroke="#ecd9a0"/><text x="720" y="111" font-size="10" fill="#4d3b05">Demonstration prototype notice</text>
  <g stroke="#0b2545" fill="#fff"><rect x="712" y="132" width="246" height="28"/><rect x="712" y="166" width="246" height="28"/><rect x="712" y="200" width="246" height="28"/></g>
  <g font-size="10" fill="#444"><text x="720" y="150">[ Search ]</text><text x="720" y="184">[ Category v ]</text><text x="720" y="218">[ Availability v ]</text></g>
  <g stroke="#0b2545" fill="#fff"><rect x="712" y="242" width="246" height="110"/><rect x="712" y="362" width="246" height="110"/><rect x="712" y="482" width="246" height="106"/></g>
  <g font-size="10" fill="#333"><text x="720" y="264">[badge]  tag</text><text x="720" y="284" font-weight="700">Book title</text><text x="720" y="300">Author / due date</text><text x="720" y="332">[ Request this book ]</text><text x="720" y="384">Stacked single-column cards</text></g>
</svg>
